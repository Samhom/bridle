name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  legacy-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and verify isolated migration adapters
        run: mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-cache" -Plegacy-drivers -pl bridle-redis-jedis3,bridle-elasticsearch7,bridle-couchbase2,bridle-rocketmq4 -am verify com.spotify.fmt:fmt-maven-plugin:2.25:check
      - name: Verify standalone mixed-generation BOM consumers
        run: |
          mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-cache" -Plegacy-drivers -DskipTests install
          mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-cache" -f .ci/bom-consumers/redis/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputType=json -DoutputFile=target/dependencies.json
          mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-cache" -f .ci/bom-consumers/search/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputType=json -DoutputFile=target/dependencies.json
          python3 tools/check_bom_consumers.py
  grpc-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify experimental gRPC and resolved inventory
        run: mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-cache" -Pexperimental-grpc verify com.spotify.fmt:fmt-maven-plugin:2.25:check org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputType=json -DoutputFile=target/dependencies.json
      - name: Audit including gRPC embedded components
        run: python3 tools/audit_dependencies.py --include-experimental
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and test
        run: mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-cache" verify
      - name: Compatibility contract
        if: matrix.java == '17'
        run: |
          python3 tools/check_compatibility.py
          python3 -m unittest discover -s tools -p 'test_check_compatibility.py'
          sdk_version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().findtext('{http://maven.apache.org/POM/4.0.0}version'))")
          python3 tools/api_compatibility.py --jar "bridle-core/target/bridle-core-$sdk_version.jar" --baseline api/core-development.json
          python3 -m unittest discover -s tools -p 'test_api_compatibility.py'
          python3 -m unittest discover -s tools -p 'test_release_bundle.py'
          python3 -m unittest discover -s tools -p 'test_verify_artifacts.py'
          python3 -m unittest discover -s tools -p 'test_workflow_contract.py'
      - name: Formatting
        run: mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-cache" com.spotify.fmt:fmt-maven-plugin:2.25:check
      - name: Verify standalone installed-JAR consumers
        if: matrix.java == '17'
        run: |
          mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-cache" -DskipTests install
          python3 tools/verify_artifacts.py --offline
      - name: Resolve audit inventory
        if: matrix.java == '17'
        run: mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-cache" org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputType=json -DoutputFile=target/dependencies.json
      - name: Audit resolved and embedded components
        if: matrix.java == '17'
        run: python3 tools/audit_dependencies.py
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.java == '17'
        with:
          distribution: temurin
          java-version: '8'
      - name: Java 8 core runtime
        if: matrix.java == '17'
        run: |
          mkdir -p .local/java8
          sdk_version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().findtext('{http://maven.apache.org/POM/4.0.0}version'))")
          javac -cp "bridle-circuitbreaker/target/bridle-circuitbreaker-$sdk_version.jar:bridle-core/target/bridle-core-$sdk_version.jar" -d .local/java8 .ci/Java8Smoke.java
          java -cp ".local/java8:bridle-circuitbreaker/target/bridle-circuitbreaker-$sdk_version.jar:bridle-core/target/bridle-core-$sdk_version.jar" Java8Smoke
